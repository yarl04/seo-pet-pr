name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v7

      - name: Установить зависимости и собрать сайт
        uses: withastro/action@v6
        with:
          node-version: 22
          build-cmd: npm run check && npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v5